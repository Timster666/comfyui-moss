# Builds the ComfyUI + MOSS-Image image in the cloud and pushes it to Docker Hub.
# Runs whenever Dockerfile, start.sh or extra_model_paths.yaml change on main,
# or manually from the Actions tab ("Run workflow").
name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start.sh
      - extra_model_paths.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-moss

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # GitHub's free runners have limited disk; the image needs ~15 GB to build.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags every build twice: :latest and a version number (:v1, :v2, ...).
      # Use the version tag in RunPod to be sure you get exactly that build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:v${{ github.run_number }}

      - name: Summary
        run: |
          echo "### ✅ Pushed \`${IMAGE}:v${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this tag in your RunPod template (also available as \`:latest\`)." >> "$GITHUB_STEP_SUMMARY"
